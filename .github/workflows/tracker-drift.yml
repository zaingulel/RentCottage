name: Tracker drift

on:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Detect tracker drift
        env:
          GH_TOKEN: ${{ secrets.RENTCOTTAGE_PROJECT_READ_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          set +e
          npm run reconcile:board
          reconcile_status=$?
          npm run verify:board
          verify_status=$?
          set -e
          if [ "$reconcile_status" -ne 0 ] && [ "$reconcile_status" -ne 5 ]; then
            exit "$reconcile_status"
          fi
          if [ "$verify_status" -ne 0 ]; then exit "$verify_status"; fi
          exit 0
