name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      APP_ENVIRONMENT: test
      NEXTJS_ENV: test
      SUPABASE_PROJECT_REF: local-test
      SUPABASE_URL: http://127.0.0.1:54331
      SUPABASE_PUBLISHABLE_KEY: local-test-only
      SUPABASE_SECRET_KEY: local-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run cf-typegen
      - run: git diff --exit-code -- cloudflare-env.d.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build:worker
      - run: npm run smoke:preview

  preview:
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      deployments: write
    env:
      APP_ENVIRONMENT: preview
      NEXTJS_ENV: preview
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:worker
      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --env preview
      - name: Smoke Cloudflare preview
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          curl --fail --silent --show-error "$PREVIEW_URL/ar" > /dev/null
          curl --fail --silent --show-error "$PREVIEW_URL/api/health?check=supabase" | grep '"connected":true'
