name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ github.event.pull_request.draft == false && 'test' || 'ci-control-no-test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Record a draft without exposing the required check
        if: github.event.pull_request.draft == true
        run: echo "Draft pull request; no suite runs and no check named test is emitted."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event.pull_request.draft == false
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: github.event.pull_request.draft == false
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: github.event.pull_request.draft == false
        run: npm ci
      - if: github.event.pull_request.draft == false
        env:
          VERIFY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VERIFY_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run verify
