name: CI

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Same-repository pull request number
        required: true
        type: string
      expected_head_oid:
        description: Reviewed 40-character pull request head OID
        required: true
        type: string

permissions: {}

concurrency:
  group: quality-${{ github.repository }}-pr-${{ inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate quality request
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: write
    outputs:
      check_run_id: ${{ steps.validate.outputs.check_run_id }}
    steps:
      - name: Validate pull request and create quality check
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_HEAD_OID: ${{ inputs.expected_head_oid }}
        run: |
          set -euo pipefail

          repository="zaingulel/RentCottage"
          test "$GITHUB_REPOSITORY" = "$repository" || exit 1
          test "$GITHUB_REF" = "refs/heads/main" || exit 1
          [[ "$PULL_REQUEST_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$EXPECTED_HEAD_OID" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          expected_head_oid="$(printf '%s' "$EXPECTED_HEAD_OID" | tr '[:upper:]' '[:lower:]')"

          IFS=$'\t' read -r state live_head_oid head_repository base_ref < <(
            gh api "repos/$repository/pulls/$PULL_REQUEST_NUMBER" \
              --jq '[.state, .head.sha, .head.repo.full_name, .base.ref] | @tsv'
          )
          test "$state" = "open" || exit 1
          test "$head_repository" = "$repository" || exit 1
          test "$live_head_oid" = "$expected_head_oid" || exit 1
          [[ "$base_ref" != graphite-base/* && "$base_ref" != */graphite-base/* ]] || exit 1

          check_run_id="$(
            gh api "repos/$repository/check-runs" \
              --method POST \
              -f name=quality \
              -f head_sha="$expected_head_oid" \
              -f status=in_progress \
              --jq .id
          )"
          [[ "$check_run_id" =~ ^[1-9][0-9]*$ ]] || exit 1
          printf 'check_run_id=%s\n' "$check_run_id" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify exact pull request head
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_head_oid }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify

  finalize:
    name: Finalize quality check
    needs: [validate, verify]
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - name: Finalize quality check
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_HEAD_OID: ${{ inputs.expected_head_oid }}
          CHECK_RUN_ID: ${{ needs.validate.outputs.check_run_id }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          set -uo pipefail

          repository="zaingulel/RentCottage"
          [[ "$CHECK_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$EXPECTED_HEAD_OID" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          expected_head_oid="$(printf '%s' "$EXPECTED_HEAD_OID" | tr '[:upper:]' '[:lower:]')"
          conclusion=failure
          summary="Verification failed or the pull request changed before finalization."
          evidence_valid=true

          if [[ "$VERIFY_RESULT" = "cancelled" ]]; then
            conclusion=cancelled
            summary="Verification was cancelled."
          fi

          if ! pr_evidence="$(
            gh api "repos/$repository/pulls/$PULL_REQUEST_NUMBER" \
              --jq '[.state, .head.sha, .head.repo.full_name] | @tsv'
          )"; then
            evidence_valid=false
          else
            IFS=$'\t' read -r state live_head_oid head_repository <<< "$pr_evidence"
            if [[ "$state" != "open" || "$head_repository" != "$repository" || "$live_head_oid" != "$expected_head_oid" ]]; then
              evidence_valid=false
            fi
          fi

          if [[ "$VERIFY_RESULT" = "success" && "$evidence_valid" = true ]]; then
            conclusion=success
            summary="Verification passed for the current same-repository pull request head."
          elif [[ "$VERIFY_RESULT" = "success" ]]; then
            conclusion=failure
            summary="Verification finished, but the pull request evidence is no longer current."
          fi

          finalized=false
          for attempt in 1 2 3; do
            if gh api "repos/$repository/check-runs/$CHECK_RUN_ID" \
              --method PATCH \
              -f status=completed \
              -f conclusion="$conclusion" \
              -f 'output[title]=quality' \
              -f "output[summary]=$summary"; then
              finalized=true
              break
            fi
          done
          test "$finalized" = true || exit 1

          if [[ "$VERIFY_RESULT" = "success" && "$conclusion" != "success" ]]; then
            exit 1
          fi
