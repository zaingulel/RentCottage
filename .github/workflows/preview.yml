name: Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      deployments: write
    env:
      APP_ENVIRONMENT: preview
      NEXTJS_ENV: preview
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:worker
      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --env preview
      - name: Smoke Cloudflare preview
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          curl --fail --silent --show-error "$PREVIEW_URL/ar" > /dev/null
          curl --fail --silent --show-error "$PREVIEW_URL/api/health?check=supabase" | grep '"connected":true'
