name: Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      deployments: write
    env:
      APP_ENVIRONMENT: preview
      NEXTJS_ENV: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm run build:worker
      - id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: preview
          secrets: SUPABASE_SECRET_KEY
          command: >-
            versions upload --env preview
            --var SUPABASE_PROJECT_REF:${{ vars.SUPABASE_PROJECT_REF }}
            --var SUPABASE_URL:${{ vars.SUPABASE_URL }}
            --var SUPABASE_PUBLISHABLE_KEY:${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - name: Smoke Cloudflare preview
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          curl --fail --silent --show-error "$PREVIEW_URL/ar" > /dev/null
          curl --fail --silent --show-error "$PREVIEW_URL/api/health?check=supabase" | grep '"connected":true'
