name: Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      deployments: write
    env:
      APP_ENVIRONMENT: preview
      NEXTJS_ENV: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm run build:worker
      - name: Prepare preview deployment secrets
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PRIVILEGED_AUDIT_HMAC_KEY: ${{ secrets.PRIVILEGED_AUDIT_HMAC_KEY }}
        run: |
          npm run verify:supabase-secret
          node scripts/write-preview-deployment-secrets.mjs "$RUNNER_TEMP/muntajaa-preview-secrets.json"
      - id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: preview
          command: >-
            deploy --env preview
            --secrets-file ${{ runner.temp }}/muntajaa-preview-secrets.json
            --tag ${{ github.sha }}
            --var SUPABASE_PROJECT_REF:${{ vars.SUPABASE_PROJECT_REF }}
            --var SUPABASE_URL:${{ vars.SUPABASE_URL }}
            --var SUPABASE_PUBLISHABLE_KEY:${{ vars.SUPABASE_PUBLISHABLE_KEY }}
            --var DEPLOYMENT_COMMIT:${{ github.sha }}
      - name: Remove preview deployment secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/muntajaa-preview-secrets.json"
      - name: Verify active Cloudflare version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run verify:cloudflare-deployment -- preview "${{ github.sha }}"
      - name: Verify Cloudflare preview
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: npm run verify:preview -- "$PREVIEW_URL"
